ktor:
  deployment:
    port: 8080
  application:
    modules:
      - me.basehub.ApplicationKt.module

database:
  url: ${DATABASE_URL}
  user: ${DATABASE_USER}
  password: ${DATABASE_PASSWORD}
  driver: "org.postgresql.Driver"

jwt:
  secret: ${JWT_SECRET}
  issuer: "reliable-messaging-backend"
  audience: "reliable-messaging-mobile"
  realm: "reliable-messaging-api"
